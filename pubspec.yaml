name: app.rynest.aasi
description: A Examination App for AASI

version: 4.0.0+30

environment:
  sdk: ">=3.3.0 <4.0.0"

publish_to: 'none'

dependencies:
  camera: ^0.10.6
  carousel_slider: ^5.0.0
  cupertino_icons: ^1.0.8
  device_info_plus: ^11.1.1
  dio: ^5.4.0
  flip_card: ^0.7.0
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  freezed_annotation: ^2.4.1
  go_router: ^14.6.0
  envied: ^1.0.0
  json_annotation: ^4.8.1
  flutter_html: ^3.0.0-alpha.6
  flutter_local_notifications: ^19.2.0
  flutter_localizations:
    sdk: flutter
  flutter_image_compress: ^2.3.0
  flutter_spinkit: ^5.2.0
  image: ^4.1.3
  intl: ^0.20.2
  package_info_plus: ^8.0.2
  qr_flutter: ^4.1.0
  shared_preferences: ^2.5.3
  url_launcher: ^6.2.1
  google_mlkit_text_recognition: ^0.14.0
  google_mlkit_commons: ^0.9.0
  smooth_page_indicator: ^1.2.0+3
  super_icons: ^1.0.3
  path_provider: ^2.1.5
  network_info_plus: ^6.1.1
  connectivity_plus: ^6.1.0
  flutter_widget_from_html: ^0.15.3
  shimmer: ^3.0.0
  html: ^0.15.4
  permission_handler: ^11.1.0
  geolocator: ^13.0.2
  geocoding: ^3.0.0
  pusher_webman: 
    path: ../pusher_webman
    # git:
    #   url: https://github.com/antho-firuze/pusher_webman.git
  talker_flutter: ^4.7.6
  talker_dio_logger: ^4.7.6
  timezone: ^0.10.1
  uuid: ^4.5.1

dev_dependencies:
  build_runner: ^2.4.7
  envied_generator: ^1.0.0
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter
  icons_launcher: ^3.0.0
  freezed: ^2.4.6
  json_serializable: ^6.7.1
  custom_lint: ^0.7.0
  riverpod_lint: ^2.6.3

flutter:
  uses-material-design: true

  assets:
    - assets/icons/
    - assets/images/
    - assets/sound/
    - assets/translations/

icons_launcher:
  platforms:
    android:
      enable: true
      image_path: "assets/icons/app-icon.png"
    ios:
      enable: true
      image_path: "assets/icons/app-icon-ios.png"
